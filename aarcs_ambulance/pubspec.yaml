name: aacrs_app
description: "AARCS Emergency Ambulance System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase Services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  # Location & Maps
  geolocator: ^10.1.1
  google_maps_flutter: ^2.9.0
  geocoding: ^3.0.0

  # Networking
  http: ^1.2.2

  # Permissions
  permission_handler: ^11.3.1

  # UI & Utilities
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  flutter_typeahead: ^5.2.0
  flutter_dotenv: ^5.1.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/amb.png
