name: aarcs_traffic
description: "AARCS Traffic Police System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase Services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1        # ← ADD THIS for authentication
  firebase_database: ^11.1.4

  # Maps & Location
  google_maps_flutter: ^2.9.0
  flutter_polyline_points: ^2.0.0
  location: ^5.0.3

  # Networking
  http: ^1.2.2

  # Utilities
  shared_preferences: ^2.3.2
  flutter_dotenv: ^5.1.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
